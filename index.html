<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

    <title>My Day</title>

    <!-- PWA & Mobile Web App -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#111111">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="application-name" content="My Day">

    <!-- iOS PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="My Day">
    <link rel="apple-touch-icon" href="assets/icons/icon-180.png">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/icons/icon-180.png">
    <link rel="apple-touch-icon-precomposed" href="assets/icons/icon-180.png">

    <!-- CSS -->
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/navigation.css">
    <link rel="stylesheet" href="css/journal.css">
    <link rel="stylesheet" href="css/schedule.css">
    <link rel="stylesheet" href="css/habits.css">
    <link rel="stylesheet" href="css/settings.css">
</head>

<body>
    <div id="journalYearModal" class="journal-modal-overlay" style="display: none;">
        <div class="journal-modal-content">
            <div class="journal-modal-header">
                <h3>Selecione o Mês</h3>
                <button id="closeJournalModal" class="journal-close-btn">&times;</button>
            </div>
            <div id="journalMonthsGrid" class="journal-months-grid">
                <!-- Os meses serão injetados aqui pelo JavaScript -->
            </div>
        </div>
    </div>

    <main class="app-container">
        <!-- Journal View -->
        <section id="journal-view" class="view active">
           <div class="journal-container">
            <h2 id="journal-date"></h2>
           </div>
        </section>

        <!-- Schedule View -->
        <section id="schedule-view" class="view">
            <!-- Schedule content goes here -->
        </section>

        <!-- Habits View -->
        <section id="habits-view" class="view">
            <div class="habits-top-bar">
                <div class="habits-dropdown-container">
                    <button id="habitsDropdownBtn" class="habits-dropdown-btn">
                        this <span class="clickable-text">week</span> <span class="arrow">▼</span>
                    </button>
                   
                    <div id="habitsDropdownMenu" class="habits-dropdown-menu" style="display: none;">
                        <button class="habits-option" data-target="habits-week">week</button>
                        <button class="habits-option" data-target="habits-month">month</button>
                        <button class="habits-option" data-target="habits-year">year</button>
                    </div>
                </div>
                <button id="habitsOptionsBtn" class="habits-options-btn" title="More Options">•••</button>
            </div>

            <!-- Date Navigation Sub-Bar -->
            <div class="habits-date-nav">
                <button id="habitsPrevBtn" class="habits-date-arrow">&lt;</button>
                <span id="habitsDateDisplay" class="habits-date-label">21-28/04</span>
                <button id="habitsNextBtn" class="habits-date-arrow">&gt;</button>
            </div>

            <!-- Week Sub-View -->
            <div id="habits-week" class="habits-sub-view">
                <div class="habits-table-container">
                    <table class="habits-table">
                        <thead>
                            <tr>
                                <th class="habit-name-header"></th>
                                <th>S</th>
                                <th>M</th>
                                <th>T</th>
                                <th>W</th>
                                <th>T</th>
                                <th>F</th>
                                <th>S</th>
                                <th class="habit-score-header"></th>
                            </tr>
                        </thead>
                        <tbody id="habitsTableBody"></tbody>
                    </table>
                </div>

                <!-- Sleep Section -->
                <div class="sleep-section">
                    <h3>sleep</h3>

                    <div class="sleep-chart-container" id="sleepChartContainer">
                        <div class="sleep-bars-grid" id="sleepBarsGrid"></div>
                    </div>

                    <div class="sleep-stats">
                        <span>
                            Average:
                            <strong id="sleepAvg">0 hours</strong>
                        </span>
                        <span>
                            Median:
                            <strong id="sleepMedian">0 hours</strong>
                        </span>
                    </div>
                </div>
            </div>

            <!-- Month Sub-View -->
            <div id="habits-month" class="habits-sub-view" style="display: none;">
                <div class="habits-month-container" id="habitsMonthContainer">
                    <!-- Rendered dynamically via JS -->
                </div>
            </div>

            <!-- Year Sub-View -->
            <div id="habits-year" class="habits-sub-view" style="display: none;">
                <!-- Year habits content -->
            </div>
        </section>
    </main>

    <!-- Global Modals (Outside views) -->
    <div id="sleepPromptModal" class="sleep-modal-overlay" style="display: none;">
        <div class="sleep-modal-content">
            <h4>Sleep Quality</h4>

            <div class="sleep-star-picker" id="sleepStarPicker">
                <span data-rating="1">★</span>
                <span data-rating="2">★</span>
                <span data-rating="3">★</span>
                <span data-rating="4">★</span>
                <span data-rating="5">★</span>
            </div>

            <p id="promptHoursText"></p>

            <div class="sleep-modal-btn-row">
                <button id="cancelSleepBtn" class="sleep-cancel-btn">Cancel</button>
                <button id="confirmSleepBtn" class="sleep-confirm-btn">Confirm</button>
            </div>
        </div>
    </div>

    <nav class="bottom-nav">
        <button class="nav-item active" data-target="journal-view">
            <span>Journal</span>
        </button>
        <button class="nav-item" data-target="schedule-view">
            <span>Schedule</span>
        </button>
        <button class="nav-item" data-target="habits-view">
            <span>Habits</span>
        </button>
    </nav>

    <script type="module" src="js/app.js"></script>
</body>

</html>
