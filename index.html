<!DOCTYPE html>
<html lang="en">

<head>
    
    <meta charset="UTF-8">

 <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

    <title>My Day</title>

    <!-- PWA -->
    <link rel="manifest" href="manifest.json">

    <!-- iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes">

    <meta
        name="apple-mobile-web-app-status-bar-style"
        content="black-translucent"
    >

    <meta
        name="apple-mobile-web-app-title"
        content="My Day"
    >

    <!-- iPhone Home Screen icon -->
    <link
        rel="apple-touch-icon"
        href="assets/icons/icon-180.png"
    >

    <!-- CSS -->
    <link rel="stylesheet" href="css/calendar.css">
    <link rel="stylesheet" href="css/habits.css">
    <link rel="stylesheet" href="css/journal.css">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/navigation.css">
    <link rel="stylesheet" href="css/schedule.css">
    <link rel="stylesheet" href="css/settings.css">
    <link rel="stylesheet" href="css/variables.css">

</head>

<body>
    <div id="journalYearModal" class="journal-modal-overlay" style="display: none;">
    <div class="journal-modal-content">
        <div class="journal-modal-header">
            <h3>Selecione o Mês</h3>
            <button id="closeJournalModal" class="journal-close-btn">&times;</button>
        </div>
        <div id="journalMonthsGrid" class="journal-months-grid">
            <!-- Os meses serão injetados aqui pelo JavaScript -->
        </div>
    </div>
    </div>
    <main class="app-container">
        <section id="journal-view" class="view active">

           <div class="journal-container">
            <h2 id="journal-date">
                
            </h2>
           </div>

           
        </section>

        <section id="schedule-view" class="view">
            <!-- Schedule content goes here -->
        </section>

        <section id="habits-view" class="view">
            <!-- Habits content goes here -->
        </section>
    </main>

    <nav class="bottom-nav">
        <button class="nav-item active" data-target="journal-view">
            <span>Journal</span>
        </button>
        <button class="nav-item" data-target="schedule-view">
            <span>Schedule</span>
        </button>
        <button class="nav-item" data-target="habits-view">
            <span>Habits</span>
        </button>
    </nav>

    <script type="module" src="js/app.js"> </script>
</body>

</html>
